<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — Muskan Portfolio</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    /* =========================================
       Dreamy Elegance Theme Integration
       ========================================= */
    :root {
      --smoke-white: #F5F5F7;
      --lavender-mist: #C7B9FF;
      --pink-blush: #FFB6C1;
      --peach-glow: #FE83BE;
      --midnight-charcoal: #2E2E3A;
      --lilac-bloom: #B185DB;
      --primary-gradient: linear-gradient(135deg, var(--pink-blush) 0%, var(--lavender-mist) 50%, var(--peach-glow) 100%);
      --glass-bg: rgba(255, 255, 255, 0.75);
      --card-shadow: 0 10px 30px rgba(46, 46, 58, 0.08);
      --border-soft: rgba(177, 133, 219, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--smoke-white);
      color: var(--midnight-charcoal);
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 182, 193, 0.25), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(199, 185, 255, 0.25), transparent 40%);
    }

    /* Top Navigation Header */
    .admin-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
      padding: 16px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand-logo span {
      color: var(--lilac-bloom);
    }

    .back-btn {
      color: var(--midnight-charcoal);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(177, 133, 219, 0.1);
      transition: all 0.25s ease;
    }

    .back-btn:hover {
      background: var(--lilac-bloom);
      color: white;
      transform: translateY(-2px);
    }

    /* Layout Dashboard Grid */
    .dashboard-wrapper {
      max-width: 1280px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 30px;
      align-items: start;
    }

    /* Glass Panels */
    .panel {
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 28px;
      box-shadow: var(--card-shadow);
    }

    .panel-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--midnight-charcoal);
    }

    .panel-title i {
      color: var(--lilac-bloom);
    }

    /* Modern Styled Inputs */
    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--midnight-charcoal);
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #a0a0b0;
      font-size: 0.9rem;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid rgba(177, 133, 219, 0.25);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.9);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--midnight-charcoal);
      outline: none;
      transition: all 0.25s ease;
    }

    textarea.form-control {
      padding-left: 14px;
      resize: vertical;
      min-height: 90px;
    }

    .form-control:focus {
      border-color: var(--lilac-bloom);
      box-shadow: 0 0 0 4px rgba(177, 133, 219, 0.15);
      background: #ffffff;
    }

    /* Primary Gradient Button */
    .btn-submit {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      background: var(--primary-gradient);
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(177, 133, 219, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(177, 133, 219, 0.45);
    }

    /* Right Panel Project Grid */
    .projects-grid-admin {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .admin-card {
      background: white;
      border-radius: 16px;
      border: 1px solid rgba(177, 133, 219, 0.15);
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .admin-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--card-shadow);
    }

    .card-thumb {
      height: 140px;
      width: 100%;
      object-fit: cover;
      background: rgba(199, 185, 255, 0.1);
    }

    .card-body {
      padding: 16px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .card-body h4 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .card-body p {
      font-size: 0.82rem;
      color: rgba(46, 46, 58, 0.75);
      line-height: 1.4;
      margin-bottom: 14px;
      flex-grow: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 10px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }

    .demo-link {
      font-size: 0.8rem;
      color: var(--lilac-bloom);
      text-decoration: none;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-delete {
      background: rgba(255, 77, 77, 0.1);
      color: #ff4d4d;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-delete:hover {
      background: #ff4d4d;
      color: white;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .dashboard-wrapper {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- Header Nav -->
  <header class="admin-header">
    <div class="brand-logo">
      <i class="fa-solid fa-sliders" style="color: var(--lilac-bloom); font-size: 1.2rem;"></i>
      <h1>Muskan <span>Admin Panel</span></h1>
    </div>
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> View Live Portfolio
    </a>
  </header>

  <!-- Main Container -->
  <main class="dashboard-wrapper">
    
    <!-- Left Column: Add Project Form -->
    <section class="panel">
      <h2 class="panel-title">
        <i class="fa-solid fa-plus-circle"></i> Add New Project
      </h2>

      <form id="addProjectForm">
        <div class="form-group">
          <label for="title">Project Title</label>
          <div class="input-wrap">
            <i class="fa-solid fa-heading"></i>
            <input type="text" id="title" class="form-control" placeholder="e.g. CyberType Speed Tester" required />
          </div>
        </div>

        <div class="form-group">
          <label for="image_url">Image URL / Path</label>
          <div class="input-wrap">
            <i class="fa-solid fa-image"></i>
            <input type="text" id="image_url" class="form-control" placeholder="images/cybertype-cover.png" required />
          </div>
        </div>

        <div class="form-group">
          <label for="live_demo_url">Live Demo Link</label>
          <div class="input-wrap">
            <i class="fa-solid fa-link"></i>
            <input type="url" id="live_demo_url" class="form-control" placeholder="https://muski504.github.io/..." />
          </div>
        </div>

        <div class="form-group">
          <label for="description">Short Description</label>
          <textarea id="description" class="form-control" placeholder="Briefly describe key technologies and capabilities..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">
          <i class="fa-solid fa-cloud-arrow-up"></i> Publish Project
        </button>
      </form>
    </section>

    <!-- Right Column: Live Projects List -->
    <section class="panel">
      <h2 class="panel-title">
        <i class="fa-solid fa-layer-group"></i> Manage Portfolio Projects
      </h2>

      <div class="projects-grid-admin" id="adminProjectsList">
        <!-- Javascript will inject dynamic cards here -->
      </div>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
